name: Ironclad 10-Layer Production Engine Guard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Manual Android SDK & License Setup
        run: |
          # 1. कमांड-लाइन टूल्स डाउनलोड और अनजिप करें
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdtools.zip

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          # 2. सभी लाइसेंस खुद जनरेट और स्वीकार करें
          mkdir -p $HOME/android-sdk/licenses
          echo "8933bac161af4298b44d37beb6ad0838d093d30b" > $HOME/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "24333f8a43b681423c0debca1129d41656ae09fb" >> $HOME/android-sdk/licenses/android-sdk-preview-license
          echo "24333f8a43b681423c0debca1129d41656ae09fb" >> $HOME/android-sdk/licenses/android-sdk-arm-dbt-license

      - name: Install NDK, CMake, and Vulkan Toolchain
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev llvm-18 llvm-18-dev llvm-18-runtime libclang-cpp18-dev libvulkan-dev vulkan-tools glslang-tools
          libc6-dev gcc-multilib g++-multilib
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Run Android Lint
        run: ./gradlew lintDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Compile and Execute 10-Layer Static AST Scanner
        run: |
          LLVM_LIB_DIR=$(llvm-config-18 --libdir)
          AUTO_LIBS=$(find "$LLVM_LIB_DIR" \( -name "libclang*.a" ! -name "*clang_rt*" \) -o -name "libllvm*.a" -o -name "libclang-cpp*.so" 2>/dev/null | sed 's|.*/lib\(.*\)\.[as][oa]|-l\1|' | sort -u | tr '\n' ' ')
          
          g++ -O3 -std=c++17 app/src/main/cpp/EngineCoreCompilerWrapper.cpp \
          -o engine_host_scanner \
          $(llvm-config-18 --cxxflags --ldflags) \
          -Wl,--start-group \
          $AUTO_LIBS \
          $(llvm-config-18 --libs all --system-libs 2>/dev/null || true) \
          -Wl,--end-group \
          -lpthread -ldl -lz

          echo "=== Executing Absolute Zero-Tolerance Engine Scan ==="
          ./engine_host_scanner .

      - name: Compile Native Core with Strict Sanitizers (ASan, UBSan)
        run: |
          export CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -Werror"
          export CXXFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -Werror"
          ./gradlew assembleRelease --quiet
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Post-Build APK Validation & Khronos Layer Verification
        run: |
          mkdir -p extracted_apk
          unzip -q app/build/outputs/apk/release/app-release.apk -d extracted_apk
          echo "=== Verifying Validation Layer Manifests ==="
          find extracted_apk -type f -name "*vulkan*" -o -name "*.json"
          find extracted_apk -type f -exec du -h {} + | sort -rh

      - name: Upload Verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-apk
          path: |
            app/build/outputs/apk/**/*.apk
