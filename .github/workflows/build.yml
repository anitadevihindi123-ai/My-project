name: Build Android APK Manually

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        id: setup-android

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Official LLVM Auto-Installer (Zero Package Name Errors)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          
          # यह LLVM की आधिकारिक स्क्रिप्ट है जो सारे सही पैकेजेस खुद ढूँढकर इंस्टॉल करती है
          wget https://apt.llvm.sh/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18 all

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Run Android Lint (Check Missing Permissions & Code Flaws)
        run: ./gradlew lintDebug
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Fully Automated Zero-Config Static Scanner
        run: |
          echo "=== Dynamically Linking All Available Clang/LLVM Components ==="
          
          LLVM_LIB_DIR=$(llvm-config-18 --libdir)
          AUTO_LIBS=$(find "$LLVM_LIB_DIR" -name "libclang*.a" -o -name "libllvm*.a" -o -name "libclang-cpp*.so" 2>/dev/null | sed 's|.*/lib\(.*\)\.[as][oa]|-l\1|' | sort -u | tr '\n' ' ')
          
          g++ -O3 -std=c++17 app/src/main/cpp/EngineCoreCompilerWrapper.cpp \
          -o engine_host_scanner \
          $(llvm-config-18 --cxxflags --ldflags) \
          -Wl,--start-group \
          $AUTO_LIBS \
          $(llvm-config-18 --libs all --system-libs 2>/dev/null || true) \
          -Wl,--end-group \
          -lpthread -ldl -lz
          
          echo "=== Executing Scanner Successfully ==="
          ./engine_host_scanner .

      - name: Run Build
        run: ./gradlew assembleRelease --quiet
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Complete File-by-File APK Audit
        run: |
          echo "=== APK Size Breakdown ==="
          ls -lh app/build/outputs/apk/release/*.apk
          echo "=== Unzipping APK to check internal files ==="
          mkdir -p extracted_apk
          unzip -q app/build/outputs/apk/release/app-release.apk -d extracted_apk
          echo "=== Listing EVERY Single File Sorted by Size ==="
          find extracted_apk -type f -exec du -h {} + | sort -rh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/**/*.apk
