Name: Build Android APK Manually

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        id: setup-android

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Run Android Lint (Check Missing Permissions & Code Flaws)
        run: ./gradlew lintDebug
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Run Build
        run: ./gradlew assembleRelease --quiet
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Check APK Contents and File Sizes
        run: |
          echo "=== APK Size Breakdown ==="
          ls -lh app/build/outputs/apk/**/*.apk
          echo "=== Unzipping APK to check internal files ==="
          unzip -q app/build/outputs/apk/**/*.apk -d extracted_apk
          du -h --max-depth=2 extracted_apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/**/*.apk
