name: Build Android APK Manually

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        id: setup-android

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;23.7.10688636" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Run Android Lint (Check Missing Permissions & Code Flaws)
        run: ./gradlew lintDebug
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
     
      - name: Run Build
        run: ./gradlew assembleDebug --quiet
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

