name: Build Android APK Manually

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        id: setup-android

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install Native Clang and LLVM Development Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev llvm-18 llvm-18-dev llvm-18-runtime libclang-cpp-18-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Run Android Lint (Check Missing Permissions & Code Flaws)
        run: ./gradlew lintDebug
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Run Bulletproof Static Scanner
        run: |
          echo "=== Compiling Engine Host Scanner via Monolithic Clang-CPP ==="
          
          g++ -O3 -std=c++17 app/src/main/cpp/EngineCoreCompilerWrapper.cpp \
          -o engine_host_scanner \
          -I/usr/lib/llvm-18/include \
          -I/usr/include/llvm-18 \
          -L/usr/lib/llvm-18/lib \
          -lclang-cpp-18 \
          $(llvm-config-18 --libs core support 2>/dev/null || true) \
          -lpthread -ldl -lz
          
          echo "=== Executing Scanner Successfully ==="
          ./engine_host_scanner .

      - name: Run Build
        run: ./gradlew assembleRelease --quiet
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

      - name: Complete File-by-File APK Audit
        run: |
          echo "=== APK Size Breakdown ==="
          ls -lh app/build/outputs/apk/release/*.apk
          echo "=== Unzipping APK to check internal files ==="
          mkdir -p extracted_apk
          unzip -q app/build/outputs/apk/release/app-release.apk -d extracted_apk
          echo "=== Listing EVERY Single File Sorted by Size ==="
          find extracted_apk -type f -exec du -h {} + | sort -rh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/**/*.apk
