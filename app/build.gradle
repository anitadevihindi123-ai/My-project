plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    
    useLibrary 'org.apache.http.legacy'
    
    signingConfigs {
        release {
            storeFile file('singularity-key.jks')
            storePassword '00000000'
            keyAlias 'core_alias'
            keyPassword '00000000'
        }
    }
    
    defaultConfig {
        applicationId "com.my.newproject"
        namespace "com.my.newproject"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_MODE=arm", 
                          "-DANDROID_STL=c++_shared",
                          "-DCMAKE_CXX_CLANG_TIDY=clang-tidy;-checks=-*,modernize-*,-readability-*",
                          "-DPROJECT_ROOT=${rootDir}"
                cppFlags "-fsanitize=address -fno-omit-frame-pointer"
            }
        }
    }
    
    packaging {
        resources.excludes.add("**/codeformer_part_aa")
        resources.excludes.add("**/codeformer_part_ab")
        resources.excludes.add("**/codeformer_part_ac")
        resources.excludes.add("**/codeformer_part_ad")
    }
    
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
    
    buildFeatures {
        viewBinding true
    }
    
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-ads:23.4.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
}

tasks.register('mergeCodeFormerParts') {
    doLast {
        def assetsDir = file("src/main/assets")
        def outputFile = new File(assetsDir, "codeformer_traced.ncnn.bin")
        
        outputFile.withOutputStream { out ->
            ["codeformer_part_aa", "codeformer_part_ab", "codeformer_part_ac", "codeformer_part_ad"].forEach { partName ->
                def partFile = new File(assetsDir, partName)
                if (partFile.exists()) {
                    out.write(partFile.bytes)
                }
            }
        }
    }
}

tasks.named('preBuild') {
    dependsOn('mergeCodeFormerParts')
}
