// 👉 और यह रहा वो टास्क जो बिल्ड होने से पहले चारों टुकड़ों को जोड़कर सिंगल फाइल बना देगा
tasks.register("mergeCodeFormerParts") {
    doLast {
        val assetsDir = file("src/main/assets")
        val outputFile = File(assetsDir, "codeformer_traced.ncnn.bin")
        
        outputFile.outputStream().use { out ->
            listOf("codeformer_part_aa", "codeformer_part_ab", "codeformer_part_ac", "codeformer_part_ad").forEach { partName ->
                val partFile = File(assetsDir, partName)
                if (partFile.exists()) {
                    out.write(partFile.readBytes())
                }
            }
        }
    }
}

tasks.named("preBuild") {
    dependsOn("mergeCodeFormerParts")
}
